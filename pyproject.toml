[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-team-sync"
version = "0.2.0"
description = "Change management toolkit for teams working with AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Patrick Vestal", email = "patrick.vestal@gmail.com"},
]
keywords = ["ai", "change-management", "team", "agents", "claude", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "click>=8.1.0",
    "httpx>=0.26.0",
    "tomli>=2.0.0;python_version<'3.11'",
    # UPPER BOUND IS LOAD-BEARING. mcp 2.x removed the low-level decorator API
    # (@Server.list_tools / @Server.call_tool) and dropped mcp.server.fastmcp
    # entirely. src/ai_team_sync/mcp/server.py is built on those decorators, so an
    # unbounded ">=1.0.0" lets a --force-reinstall pull 2.x and the MCP entrypoint
    # then dies at IMPORT time:
    #   server.py:151 @mcp_server.list_tools()
    #   -> AttributeError: 'Server' object has no attribute 'list_tools'
    # The failure is silent to operators: SessionStart health checks report
    # "ok ai-team-sync (stdio)" because that check only resolves the binary, never
    # loads its tools. Result was a fleet-wide outage in which ZERO ATS tools were
    # exposed to ANY Claude session, so no session could declare scope, take locks,
    # or record decisions — while the `ats` CLI and the :8400 server kept working,
    # making the board look merely under-used rather than broken.
    # Raise this bound only together with a port of mcp/server.py to the 2.x API.
    "mcp>=1.0.0,<2",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]  # kept for back-compat; asyncpg is now a core dep
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
]

[project.scripts]
ats = "ai_team_sync.cli:cli"
ats-server = "ai_team_sync.server:main"
ats-mcp = "ai_team_sync.mcp.server:run"
ats-presence-hook = "ai_team_sync.hooks.post_tool_use_presence:main"

[project.urls]
Homepage = "https://github.com/pvestal/ai-team-sync"
Repository = "https://github.com/pvestal/ai-team-sync"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
